set -g mouse on
# weniger history = weniger memory pressure bei großen outputs
set -g history-limit 3000
# escape-time runter für reaktionsschnelleres tmux
set -sg escape-time 0
# clipboard handling deaktivieren (vermeidet hänger bei grosser ausgabe)
set -g set-clipboard off
# message-wait runter (nachrichten verschwinden schneller)
set -g display-time 2000
# kleinstmögliche refresh-rate für rendering
set -g status-interval 5
